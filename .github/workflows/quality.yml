name: Portfolio quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate markup, anchors, assets and accessibility basics
        run: python3 scripts/check_site.py
      - name: Validate JavaScript syntax
        run: |
          node --check script.js
          node --check universe.js
      - name: Test animation controls and lifecycle
        run: node scripts/test_motion.cjs
